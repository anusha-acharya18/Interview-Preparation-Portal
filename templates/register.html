<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | PrepMaster</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #e9ddff, #dff1ff, #ffe8f2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #d8c9f5;
        }

        h1 {
            color: #6549b5;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #77718b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #45415e;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd5ef;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #7655d9;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #7655d9;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5c3db8;
        }

        .message {
            color: #b83232;
            text-align: center;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #68627d;
        }

        a {
            color: #7655d9;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>✨ PrepMaster</h1>
        <p class="subtitle">Create Your Student Account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Full Name</label>
            <input type="text" name="fullname"
                   placeholder="Enter your full name"
                   autocomplete="name" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email"
                   autocomplete="email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create a password"
                   minlength="8"
                   autocomplete="new-password" required>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <a class="home-link" href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</body>
</html>
